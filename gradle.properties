# COMPAT mantém o daemon no charset da plataforma: o caminho do projeto tem acentos
# (Programação) e o classpath dos testes é gravado nesse charset. Os fontes continuam
# em UTF-8 porque cada JavaCompile define o encoding explicitamente.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=COMPAT
android.useAndroidX=true
android.nonTransitiveRClass=true
org.gradle.parallel=true

# O caminho do projeto contém acentos (Programação)
android.overridePathCheck=true
